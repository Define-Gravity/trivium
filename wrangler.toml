name = "trivium"
main = "src/index.ts"
compatibility_date = "2026-10-06"

# D1: tamper-evident audit ledger + task state
[[d1_databases]]
binding = "LEDGER_DB"
database_name = "trivium-ledger"
database_id = "7b3034d6-a67a-47a8-8583-6e6e7e7af83b"

# Durable Object: single-writer merge coordinator
[durable_objects]
bindings = [{ name = "MERGE_COORDINATOR", class_name = "MergeCoordinator" }]

[[migrations]]
tag = "v1"
new_sqlite_classes = ["MergeCoordinator"]

# Workflow: sequential review gate (tests -> scans -> tier -> merge/escalate)
[[workflows]]
binding = "REVIEW_GATE"
name = "review-gate"
class_name = "ReviewGate"

# Artifacts: uncomment after creating the namespace
[[artifacts]]
binding = "ARTIFACTS"
namespace = "trivium"
